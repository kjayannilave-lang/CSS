<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>

<style>

/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* ✅ Background gradient (matches your image) */
body{
    height:100vh;

    background: linear-gradient(
        to bottom,
        #6f7376,
        #8a8d8f,
        #b9a99c
    );

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Login box */
.login-box{
    width:420px;
    background:white;
    padding:40px;
    border-radius:5px;
}

/* Heading */
.login-box h2{
    color:#d35400;
    margin-bottom:20px;
}

/* Labels */
label{
    display:block;
    margin-top:10px;
}

/* Inputs */
input[type="text"],
input[type="password"]{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
}

/* Remember section */
.remember{
    margin:15px 0;
    font-size:14px;
}

/* Button */
button{
    width:100%;
    padding:12px;
    background:#d35400;
    color:white;
    border:none;
    cursor:pointer;
}

/* Hover effect (opacity) */
button:hover{
    opacity:0.7;
}

/* ✅ Responsive */
@media(max-width:768px){

    .login-box{
        width:90%;
        padding:25px;
    }

    body{
        padding:20px;
        align-items:flex-start;
    }
}

</style>
</head>

<body>

<div class="login-box">
    <h2>Login Form</h2>

    <label>Email :</label>
    <input type="text" placeholder="Enter Email">

    <label>Password :</label>
    <input type="password" placeholder="Enter Password">

    <div class="remember">
        <input type="checkbox"> Remember Me
    </div>

    <button>Login</button>
</div>

</body>
</html>
