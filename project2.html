<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Link</title>

    <style>

        a{
            display: inline-block;
            text-decoration: none;

            background-color: orange;
            color: white;

            padding: 12px 25px;
            border-radius: 5px;

            font-size: 18px;
            margin: 100px;
        }

        a:hover{
            opacity: 0.6;   /* Hover indication using opacity */
        }

    </style>
</head>
<body>

    <a href="#">Click Here</a>

</body>
</html>
