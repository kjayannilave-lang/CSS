   <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .inner {
            border: 2px solid black;
            padding: 10px;
            margin: 20px auto;
            text-align: center;
        }

        .middle {
            border: 4px dashed greenyellow;
            padding: 15px;
            margin: 30px auto;
            text-align: center;
        }

        .outer {
            border: 6px solid mediumslateblue;
            padding: 20px;
            margin: 60px auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="outer">
        Outer Box
        <div class="middle">
            Middle Box
            <div class="inner">
                Inner Box
            </div>
        </div>
    </div>

</body>
</html>
