<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Login Page</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* BODY */
body{
    height:100vh;
    overflow:hidden;
}

/* MAIN CONTAINER */
.container{
    display:flex;
    width:100%;
    height:100vh;
}

/* LEFT SIDE */
.left{

    width:40%;

    /* EXACT COLOR STYLE */
    background:linear-gradient(
        to bottom,
        #bcc3d4 0%,
        #d5d5de 45%,
        #f0d8cd 100%
    );
}

/* RIGHT SIDE */
.right{

    width:60%;

    background:#ffffff;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;
}

/* FORM BOX */
.form-box{

    width:100%;
    max-width:520px;

    padding:50px;

    background:#ffffff;
}

/* TITLE */
.form-box h1{

    color:#b3512d;

    font-size:50px;

    margin-bottom:40px;

    font-weight:500;
}

/* LABELS */
.form-box label{

    display:block;

    font-size:24px;

    font-weight:bold;

    margin-bottom:10px;
}

/* INPUTS */
.form-box input[type="email"],
.form-box input[type="password"]{

    width:100%;

    height:55px;

    border:1px solid #d0d0d0;

    margin-bottom:25px;

    padding-left:15px;

    font-size:20px;

    outline:none;
}

/* REMEMBER */
.remember{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:30px;

    font-size:20px;
}

/* BUTTON */
.form-box button{

    width:100%;

    height:52px;

    border:none;

    background:#c85b31;

    color:white;

    font-size:22px;

    cursor:pointer;
}

.form-box button:hover{
    opacity:0.9;
}

/* RESPONSIVE */
@media(max-width:900px){

    /* HIDE COLOR SIDE */
    .left{
        display:none;
    }

    /* FORM FULL WIDTH */
    .right{
        width:100%;
    }

    .form-box{
        max-width:450px;
        padding:35px;
    }

    .form-box h1{
        font-size:40px;
    }

    .form-box label{
        font-size:20px;
    }

    .form-box input[type="email"],
    .form-box input[type="password"]{
        height:50px;
        font-size:18px;
    }

    .remember{
        font-size:18px;
    }

    .form-box button{
        height:50px;
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT COLOR SECTION -->
    <div class="left"></div>

    <!-- RIGHT FORM SECTION -->
    <div class="right">

        <div class="form-box">

            <h1>Login Form</h1>

            <label>Email :</label>
            <input type="email">

            <label>Password :</label>
            <input type="password">

            <div class="remember">
                <input type="radio">
                <span>Remember Me</span>
            </div>

            <button>Login</button>

        </div>

    </div>

</div>

</body>
</html>
