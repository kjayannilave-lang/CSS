<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Product Table</title>

    <style>

        table {
            width: 60%;
            margin: 50px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid black;   /* Proper borders */
            padding: 15px;
            text-align: center;

            background-color: grey;   /* Grey background */
            color: white;             /* White text */
        }

        th {
            font-size: 20px;
        }

    </style>
</head>
<body>

    <table>
        <tr>
            <th>Id</th>
            <th>Product Name</th>
            <th>Product Price</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Laptop</td>
            <td>₹55000</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Mobile</td>
            <td>₹25000</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Headphones</td>
            <td>₹2000</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Keyboard</td>
            <td>₹1500</td>
        </tr>

        <tr>
            <td>5</td>
            <td>Mouse</td>
            <td>₹800</td>
        </tr>

    </table>

</body>
</html>
